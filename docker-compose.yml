services:
  minio:
    image: minio/minio:latest
    container_name: botnotes_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio_data:/data
    networks:
      - botnotes_net

  api:
    build: ./bot
    container_name: botnotes_api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/storage
    depends_on:
      - minio
    networks:
      - botnotes_net

  bot:
    build: ./bot
    container_name: botnotes_bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - SERVICE_ROLE=bot
      # Прокси – SOCKS5 на localhost (доступен, т.к. мы в host-режиме)
      - HTTP_PROXY=socks5://127.0.0.1:10808
      - HTTPS_PROXY=socks5://127.0.0.1:10808
      # Если ваш код использует переменную для адреса MinIO – укажите её
      # Например, если у вас в коде читается MINIO_ENDPOINT:
      - MINIO_ENDPOINT=localhost:9000
      # Если в коде используется другая переменная – замените соответственно
    network_mode: "host"        # <-- главное – даём доступ к локальному прокси
    volumes:
      - ./data:/app/storage
    depends_on:
      - minio
    # НЕ подключаем к botnotes_net, т.к. host-режим несовместим с networks
    # extra_hosts тоже убираем

volumes:
  minio_data:

networks:
  botnotes_net:
    driver: bridge